name: Test viewer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 has no setup-python build for Ubuntu 26.04.
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
